name: CI
on:
  push:
    paths: ['package.json', 'package-lock.json', 'tsconfig.json', 'vitest.config.ts', 'src/**', 'test/**', '.github/**']
  pull_request:
    paths: ['package.json', 'package-lock.json', 'tsconfig.json', 'vitest.config.ts', 'src/**', 'test/**', '.github/**']
jobs:
  test:
    # Pinned: Playwright 1.58 cannot install browsers on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npx tsc --noEmit
      - run: npm test
